[workspace]
authors = ["Yidan4 <bio.aidan@gmail.com>"]
channels = ["conda-forge"]
name = "vidgear_test"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.12.0,<3.13"
fastapi = "*"
uvicorn = "*"
websockets = "*"
pytest = "*"

[pypi-dependencies]
vidgear = { version = ">=0.3.5, <0.4", extras = ["core"] }
opencv-python = ">=5.0.0.93, <6"

[tasks]
sender = "python sender.py"
relay = "python relay.py"
bench = "python bench.py"
test = "pytest -q"

